<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HYBRID TRAINING｜ABC-MART × OTC</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Archivo+Black&display=swap');

  :root{
    --lime: #d9f04c;
    --lime-dk: #a9bc2e;
    --ink: #17181a;
    --ink-soft: #2a2b2e;
    --paper: #fbfbf5;
    --sub: #5b5c55;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0;
    background: var(--lime);
    color: var(--ink);
    font-family: 'Noto Sans TC', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .noise-layer{
    position: fixed; inset:0;
    pointer-events:none;
    opacity:.05;
    mix-blend-mode:multiply;
    z-index: 50;
  }

  /* ---------- LOADER ---------- */
  body.loading{ overflow:hidden; height:100vh; }

  .loader{
    position:fixed; inset:0;
    background: var(--lime);
    z-index: 9999;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    transition: opacity .5s ease, visibility .5s ease;
  }
  .loader.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }
  .loader-stage{
    position:relative;
    width: 42vw;
    max-width: 260px;
    aspect-ratio: 1 / 1;
  }
  .loader-char{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    opacity:0;
    transform: scale(.92);
    transition: opacity .25s ease, transform .25s ease;
  }
  .loader-char.active{
    opacity:1;
    transform: scale(1);
  }
  .loader-label{
    margin-top: 28px;
    font-family:'Archivo Black', sans-serif;
    letter-spacing:0.22em;
    font-size: 13px;
    color: var(--ink);
  }
  .loader-dots{
    display:flex;
    gap:6px;
    margin-top:14px;
  }
  .loader-dots span{
    width:5px; height:5px;
    border-radius:50%;
    background: var(--ink);
    opacity:.25;
  }
  .loader-dots span.on{ opacity:1; }

  /* ---------- BANNER ---------- */
  .banner-wrap{
    width: 100%;
    line-height: 0;
  }
  .banner-wrap img{
    width: 100%;
    display:block;
  }
  @media (min-width: 900px){
    .banner-wrap{ max-width: 1200px; margin: 0 auto; }
  }

  /* ---------- ABOUT ---------- */
  .about{
    max-width: 760px;
    margin: 9vh auto 6vh;
    padding: 0 6vw;
    text-align:center;
  }
  .about p{
    font-size: clamp(9px, 2.3vw, 18px);
    line-height: 1.85;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .about p b{ color: var(--ink); }

  .ig-link{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-top:22px;
    padding: 10px 20px;
    border: 1.5px solid var(--ink);
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--ink);
    text-decoration:none;
    transition: background .2s ease, color .2s ease;
  }
  .ig-link:hover{
    background: var(--ink);
    color: var(--lime);
  }

  /* ---------- OTC INTRO ---------- */
  .otc-intro{
    background: var(--ink);
    color: var(--paper);
    padding: 8vh 6vw;
  }
  .otc-intro-inner{
    max-width: 1000px;
    margin: 0 auto;
  }
  .section-kicker{
    font-size:11px;
    font-weight:900;
    letter-spacing:0.24em;
    color: var(--lime);
    margin-bottom: 10px;
    text-align:center;
  }
  .otc-intro h2{
    font-family:'Archivo Black', sans-serif;
    font-size: clamp(24px, 3.4vw, 36px);
    text-align:center;
    margin: 0 0 18px;
  }
  .otc-intro > .otc-intro-inner > p{
    max-width: 640px;
    margin: 0 auto 5vh;
    text-align:center;
    font-size: clamp(13px, 1.6vw, 16px);
    line-height:1.9;
    color:#d8d8d0;
  }
  .otc-intro p a{ color: var(--lime); }

  .collab-label{
    text-align:center;
    font-size:11px;
    letter-spacing:0.18em;
    color:#9a9a90;
    font-weight:700;
    margin-bottom: 20px;
  }
  .collab-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
  }
  .collab-card{
    background:#232426;
    border-radius: 4px;
    overflow:hidden;
  }
  .collab-card img{
    width:100%;
    display:block;
    aspect-ratio: 4/5;
    object-fit:cover;
  }
  .collab-card-cap{
    padding: 12px 14px 16px;
  }
  .collab-card-cap .brand{
    font-size:13px;
    font-weight:700;
    color: var(--paper);
    margin-bottom:3px;
  }
  .collab-card-cap .desc{
    font-size:11.5px;
    color:#a8a89f;
    line-height:1.5;
  }
  @media (max-width: 680px){
    .collab-grid{ grid-template-columns: 1fr; }
  }

  /* ---------- HYBRID TRAINING INTRO ---------- */
  .ht-intro{
    padding: 8vh 6vw;
    max-width: 900px;
    margin: 0 auto;
  }
  .ht-intro h2{
    font-family:'Archivo Black', sans-serif;
    font-size: clamp(24px, 3.4vw, 36px);
    text-align:center;
    margin: 0 0 24px;
    color: var(--ink);
  }
  .ht-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
    margin-bottom: 5vh;
  }
  .ht-item{
    text-align:center;
  }
  .ht-item .num{
    font-family:'Archivo Black', sans-serif;
    font-size: 13px;
    color: var(--lime-dk);
    margin-bottom: 10px;
  }
  .ht-item h3{
    font-size: 16px;
    margin: 0 0 8px;
    color: var(--ink);
  }
  .ht-item p{
    font-size: 13px;
    line-height:1.7;
    color: var(--sub);
    margin:0;
  }
  .ht-intro > p.ht-summary{
    text-align:center;
    font-size: clamp(13px, 1.6vw, 16px);
    line-height:1.9;
    color: var(--ink-soft);
    max-width: 680px;
    margin: 0 auto;
  }
  .ht-summary b{ color:var(--ink); }
  @media (max-width: 680px){
    .ht-grid{ grid-template-columns: 1fr; gap: 28px; }
  }

  /* ---------- FORM SECTION ---------- */
  .form-section{
    padding: 0 6vw 10vh;
    display:flex;
    flex-direction: column;
    align-items:center;
  }

  .form-card{
    width:100%;
    max-width: 720px;
    background: var(--paper);
    border-radius: 4px;
    box-shadow: 0 30px 60px -30px rgba(0,0,0,0.35);
    overflow:hidden;
    position:relative;
  }

  .form-card::before{
    content:"";
    display:block;
    height:8px;
    background: repeating-linear-gradient(
      -45deg,
      var(--ink), var(--ink) 10px,
      var(--lime) 10px, var(--lime) 20px
    );
  }

  .form-card-head{
    padding: 34px 34px 10px;
  }
  .form-card-head h2{
    font-family:'Archivo Black', sans-serif;
    font-size: clamp(22px, 3vw, 30px);
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }
  .form-card-head p{
    margin:0;
    color: var(--sub);
    font-size: 14px;
    line-height:1.7;
  }

  iframe.gform{
    width: 100%;
    min-height: 900px;
    border: none;
    display:block;
  }

  /* ---------- FOOTER ---------- */
  footer{
    text-align:center;
    padding: 4vh 6vw 6vh;
    color: var(--sub);
    font-size:12px;
    letter-spacing:0.04em;
  }

  @media (max-width: 640px){
    .banner-wrap{ width: 100%; }
  }

  /* ---------- BACK TO TOP ---------- */
  .back-to-top{
    position: fixed;
    right: 20px;
    bottom: 20px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--ink);
    color: var(--lime);
    border: none;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow: 0 10px 24px -10px rgba(0,0,0,0.5);
    opacity: 0;
    visibility: hidden;
    transform: translateY(10px);
    transition: opacity .25s ease, transform .25s ease, visibility .25s ease, background .2s ease;
    z-index: 400;
  }
  .back-to-top.show{
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }
  .back-to-top:hover{
    background: var(--ink-soft);
  }
  .back-to-top svg{
    width: 20px;
    height: 20px;
  }
  @media (max-width: 640px){
    .back-to-top{
      right: 14px;
      bottom: 14px;
      width: 44px;
      height: 44px;
    }
  }

  /* ---------- LANGUAGE SWITCH ---------- */
  .lang-switch{
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 500;
    display:flex;
    background: rgba(23,24,26,0.85);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
  }
  .lang-btn{
    border:none;
    background:transparent;
    color:#d8d8d0;
    font-family:'Noto Sans TC', sans-serif;
    font-size: 11px;
    font-weight:700;
    letter-spacing:0.04em;
    padding: 6px 13px;
    border-radius: 999px;
    cursor:pointer;
    transition: background .2s ease, color .2s ease;
  }
  .lang-btn.active{
    background: var(--lime);
    color: var(--ink);
  }
  @media (max-width: 640px){
    .lang-switch{ top: 10px; right: 10px; }
    .lang-btn{ font-size: 10px; padding: 5px 11px; }
  }

  /* ---------- TOP NAV PILL ---------- */
  .nav-pill{
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 500;
    display:inline-flex;
    align-items:center;
    gap:6px;
    background: rgba(23,24,26,0.85);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    color: #fff;
    text-decoration:none;
    border-radius: 999px;
    padding: 9px 16px;
    font-family:'Noto Sans TC', sans-serif;
    font-size: 12px;
    font-weight:700;
    letter-spacing:0.02em;
    transition: background .2s ease, transform .2s ease;
  }
  .nav-pill:hover{ background: rgba(23,24,26,1); transform: translateY(-1px); }
  @media (max-width: 640px){
    .nav-pill{ top: 10px; left: 10px; font-size: 11px; padding: 8px 13px; }
  }

  /* ---------- BOTTOM CTA (about page) ---------- */
  .bottom-cta{
    display:flex; justify-content:center; padding: 8px 24px 56px;
  }
  .bottom-cta a{
    display:inline-flex; align-items:center; gap:8px;
    background: var(--ink);
    color: var(--lime);
    text-decoration:none;
    font-family:'Archivo Black', sans-serif;
    font-size: 14px;
    letter-spacing:.02em;
    padding: 16px 30px;
    border-radius: 999px;
    transition: transform .2s ease, background .2s ease;
  }
  .bottom-cta a:hover{ transform: translateY(-2px); background:#000; }
</style>

</div>

  var switchEl = document.querySelector('.lang-switch');

  function applyLang(lang){
    document.documentElement.lang = (lang === 'en') ? 'en' : 'zh-Hant';
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var entry = i18n[el.getAttribute('data-i18n')];

      backBtn.setAttribute('aria-label', lang === 'en' ? 'Back to top' : '回到頂部');

    if (switchEl) {
      switchEl.querySelectorAll('.lang-btn').forEach(function(b){
        b.classList.toggle('active', b.getAttribute('data-lang') === lang);
      });
    }
    try { localStorage.setItem('otc_lang', lang); } catch(e){}
  }

  var savedLang = 'zh';

  if (switchEl) {

    });
  }
})();
